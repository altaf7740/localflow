[project]
name = "localflow"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.3",
    "pynput>=1.8.2",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
    "requests>=2.34.2",
    "rumps>=0.4.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
localflow = "localflow.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
