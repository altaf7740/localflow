[project]
name = "localflow"
version = "0.1.0"
description = "Fully local Hinglish dictation, Wispr Flow style"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pynput>=1.8.2",
    "requests>=2.34.2",
    "sounddevice>=0.5.6",
    # macOS
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pyobjc-framework-cocoa>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=12.2.2; sys_platform == 'darwin'",
    "rumps>=0.4.0; sys_platform == 'darwin'",
    # Windows, Linux, Intel Macs
    "faster-whisper>=1.1.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "pillow>=10.0; sys_platform != 'darwin'",
    "pyperclip>=1.9; sys_platform != 'darwin'",
    "pystray>=0.19.5; sys_platform != 'darwin'",
]

[project.scripts]
localflow = "localflow.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
