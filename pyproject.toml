[project]
name = "localflow"
version = "0.1.0"
description = "Fully local Hinglish dictation, Wispr Flow style"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ===========================================================================
    # CORE  (src/main.py, src/core/, src/shared/)
    # ===========================================================================
    "numpy>=2.5.3",                 # Audio buffers
    "sounddevice>=0.5.6",           # Microphone capture (src/shared/audio.py)
    "pynput>=1.8.2",                # Global hotkey + Ctrl+V on Windows/Linux (src/core/dictation.py)
    "requests>=2.34.2",             # Ollama HTTP API (src/modules/cleanup/)
    # ===========================================================================
    # macOS  (src/modules/ui/menubar.py, src/shared/paste.py)
    # ===========================================================================
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",  # Whisper on Apple GPU
    "pyobjc-framework-cocoa>=12.2.2; sys_platform == 'darwin'",                      # Clipboard
    "pyobjc-framework-quartz>=12.2.2; sys_platform == 'darwin'",                     # ⌘V key events
    "rumps>=0.4.0; sys_platform == 'darwin'",                                        # Menu-bar app
    # ===========================================================================
    # Windows, Linux, Intel Macs  (src/modules/ui/tray.py, src/modules/asr/)
    # ===========================================================================
    "faster-whisper>=1.1.0; sys_platform != 'darwin' or platform_machine != 'arm64'",  # Whisper on CUDA/CPU
    "pillow>=10.0; sys_platform != 'darwin'",                                          # Tray icons
    "pyperclip>=1.9; sys_platform != 'darwin'",                                        # Clipboard
    "pystray>=0.19.5; sys_platform != 'darwin'",                                       # System tray
]

[dependency-groups]
dev = [
    # Testing (src/tests/)
    "pytest>=8.0.0",
    # Code Quality
    "ruff>=0.12.2",
]

[tool.ruff]
indent-width = 4
line-length = 120
include = ["src/**/*.py", "scripts/**/*.py"]
cache-dir = ".ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
fixable = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
# src/ is a namespace package (no __init__.py), so the project root must be on
# sys.path for "from src.…" imports to resolve.
pythonpath = ["."]
