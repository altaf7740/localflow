<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LocalFlow</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6a66; --line: #e3e1db;
    --accent: #c2410c; --accent-text: #ffffff; --recording: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1f1f1c; --text: #ecebe6; --muted: #9a9890; --line: #33322e;
      --accent: #f97316; --accent-text: #161614; --recording: #ef4444;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 10px; text-transform: uppercase; letter-spacing: 0.04em; }
  textarea {
    width: 100%; min-height: 90px; resize: vertical; padding: 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  .controls.end { justify-content: flex-end; margin-top: 10px; }
  label.check { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
  button, .file {
    font: inherit; font-weight: 600; padding: 8px 18px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.recording { background: var(--recording); border-color: var(--recording); color: #fff; }
  button:disabled { opacity: 0.5; cursor: default; }
  .file input { display: none; }
  #key {
    margin-left: auto; min-width: 0; flex: 0 1 240px; padding: 7px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-size: 13px;
  }
  #status { margin: 18px 0 8px; color: var(--muted); min-height: 1.5em; }
  #status.error { color: #dc2626; }
  ol { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  li { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .raw { color: var(--muted); font-size: 13px; }
  .text { font-size: 17px; margin: 2px 0 6px; }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; align-items: center; }
  .stats button { font-size: 12px; padding: 2px 10px; font-weight: 500; }
</style>
</head>
<body>
<main>
  <h1>LocalFlow</h1>
  <p class="sub">Speak Hinglish, get text. Runs on this machine: Whisper, then the Ollama cleanup.</p>

  <div class="panel">
    <h2>Audio</h2>
    <div class="controls">
      <button id="record" class="primary">Record</button>
      <label class="file">Upload audio<input type="file" id="file" accept="audio/*"></label>
      <label class="check"><input type="checkbox" id="cleanup" checked> Cleanup</label>
      <input type="password" id="key" placeholder="API key, if the server has one" autocomplete="off">
    </div>
  </div>

  <div class="panel">
    <h2>Cleanup only</h2>
    <textarea id="text" placeholder="Paste a raw transcript, e.g. मैं कल meeting में आऊंगा"></textarea>
    <div class="controls end"><button id="clean">Clean</button></div>
  </div>

  <div id="status"></div>
  <ol id="results"></ol>
</main>

<script>
const RATE = 16000;   // what the server's Whisper expects
const $ = (id) => document.getElementById(id);
let recorder = null;

function setStatus(text, error = false) {
  $("status").textContent = text;
  $("status").className = error ? "error" : "";
}

function busy(on) {
  for (const id of ["file", "clean", "cleanup"]) $(id).disabled = on;
  if (!recorder) $("record").disabled = on;
}

// any format the browser can decode → 16 kHz mono 16-bit WAV
async function toWav(blob) {
  const ctx = new AudioContext();
  let decoded;
  try {
    decoded = await ctx.decodeAudioData(await blob.arrayBuffer());
  } finally {
    ctx.close();
  }
  const offline = new OfflineAudioContext(1, Math.ceil(decoded.duration * RATE), RATE);
  const source = offline.createBufferSource();
  source.buffer = decoded;
  source.connect(offline.destination);
  source.start();
  const samples = (await offline.startRendering()).getChannelData(0);

  const out = new DataView(new ArrayBuffer(44 + samples.length * 2));
  const str = (offset, s) => [...s].forEach((c, i) => out.setUint8(offset + i, c.charCodeAt(0)));
  str(0, "RIFF"); out.setUint32(4, 36 + samples.length * 2, true); str(8, "WAVE");
  str(12, "fmt "); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true);
  out.setUint32(24, RATE, true); out.setUint32(28, RATE * 2, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true);
  str(36, "data"); out.setUint32(40, samples.length * 2, true);
  samples.forEach((s, i) => out.setInt16(44 + i * 2, Math.max(-1, Math.min(1, s)) * 32767, true));
  return new Blob([out], { type: "audio/wav" });
}

async function post(path, body, headers) {
  const key = $("key").value.trim();
  if (key) headers = { ...headers, Authorization: `Bearer ${key}` };
  const resp = await fetch(path, { method: "POST", headers, body });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || resp.statusText);
  return data;
}

function show(result, label) {
  const li = document.createElement("li");
  if (result.raw !== undefined && result.raw !== result.text) {
    const raw = document.createElement("div");
    raw.className = "raw";
    raw.textContent = result.raw || "(no speech)";
    li.append(raw);
  }
  const text = document.createElement("div");
  text.className = "text";
  text.textContent = result.text || "(no speech)";
  li.append(text);

  const stats = document.createElement("div");
  stats.className = "stats";
  const parts = [label];
  if (result.timings.asr !== undefined) parts.push(`asr ${result.timings.asr.toFixed(2)} s`);
  if (result.timings.llm) parts.push(`llm ${result.timings.llm.toFixed(2)} s`);
  for (const p of parts) {
    const span = document.createElement("span");
    span.textContent = p;
    stats.append(span);
  }
  const copy = document.createElement("button");
  copy.textContent = "Copy";
  copy.onclick = () => navigator.clipboard.writeText(result.text);
  stats.append(copy);
  li.append(stats);
  $("results").prepend(li);
}

async function transcribe(blob, label) {
  busy(true);
  try {
    setStatus("Converting…");
    const wav = await toWav(blob);
    setStatus("Transcribing…");
    const query = $("cleanup").checked ? "" : "?cleanup=0";
    show(await post("/api/transcribe" + query, wav, { "Content-Type": "audio/wav" }), label);
    setStatus("");
  } catch (e) {
    setStatus(e.message, true);
  } finally {
    busy(false);
  }
}

$("record").onclick = async () => {
  if (recorder) {
    recorder.stop();
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    return setStatus(`Microphone unavailable: ${e.message}`, true);
  }
  const chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = (e) => chunks.push(e.data);
  recorder.onstop = () => {
    stream.getTracks().forEach((t) => t.stop());
    recorder = null;
    $("record").textContent = "Record";
    $("record").className = "primary";
    transcribe(new Blob(chunks, { type: chunks[0]?.type }), "microphone");
  };
  recorder.start();
  $("record").textContent = "Stop";
  $("record").className = "recording";
  setStatus("Recording… press Stop when done.");
};

$("file").onchange = () => {
  const file = $("file").files[0];
  $("file").value = "";
  if (file) transcribe(file, file.name);
};

$("clean").onclick = async () => {
  const text = $("text").value.trim();
  if (!text) return;
  busy(true);
  setStatus("Cleaning…");
  try {
    show(await post("/api/clean", JSON.stringify({ text }), { "Content-Type": "application/json" }), "text");
    setStatus("");
  } catch (e) {
    setStatus(e.message, true);
  } finally {
    busy(false);
  }
};
</script>
</body>
</html>
